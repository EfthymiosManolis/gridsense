services:
  seed:
    build:
      context: .
      dockerfile: api/Dockerfile

    entrypoint: ["python", "/app/scripts/seed.py"]
    environment:
      BOOTSTRAP_ONLY: "1"
      SCRIPT_MONGO_URI: mongodb://catalog-db:27017/gridsense
      SCRIPT_CASSANDRA_HOST: timeseries-db
      SCRIPT_CASSANDRA_PORT: "9042"
      SCRIPT_REDIS_HOST: cache
      SCRIPT_REDIS_PORT: "6379"
      SCRIPT_NEO4J_URI: bolt://graph-db:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SCRIPT_POSTGRES_HOST: billing-db
      SCRIPT_POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - gridsense_net
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: bolt://graph-db:7687
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: billing-db
      POSTGRES_PORT: "5432"
      MONGO_URI: mongodb://catalog-db:27017
      MONGO_DB: gridsense
      CASSANDRA_HOST: timeseries-db
      CASSANDRA_PORT: "9042"
      REDIS_HOST: cache
      REDIS_PORT: "6379"
    networks:
      - gridsense_net
    depends_on:
      seed:
        condition: service_completed_successfully
      timeseries-db:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  timeseries-db:
     image: cassandra:4.1
     container_name: gridsense_cassandra
     restart: unless-stopped
     ports:
       - "9042:9042"
     environment:
       CASSANDRA_CLUSTER_NAME: "GridSenseCluster"
       CASSANDRA_DC: "dc1"
       HEAP_NEWSIZE: "128M"
       MAX_HEAP_SIZE: "512M"
     volumes:
       - cassandra_data:/var/lib/cassandra
       - ./cql/init.cql:/docker-entrypoint-initdb.d/init.cql
     networks:
      - gridsense_net
     healthcheck:
       test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
       interval: 30s
       timeout: 10s
       retries: 10

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      timeseries-db:
        condition: service_healthy
    volumes:
      - ./cql/init.cql:/init.cql:ro
    networks:
      - gridsense_net
    command: ["cqlsh", "timeseries-db", "9042", "-f", "/init.cql"]
    restart: "no"

  graph-db:
     image: neo4j:5-community
     container_name: gridsense_neo4j
     restart: unless-stopped
     ports:
       - "7474:7474"
       - "7687:7687"
     environment:
       NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
       NEO4J_PLUGINS: '["apoc"]'
       NEO4J_dbms_memory_heap_max__size: "512M"
     volumes:
       - neo4j_data:/data
       - ./neo4j/import:/import
     networks:
       - gridsense_net
     healthcheck:
       test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]

  catalog-db:
    image: mongo:7
    container_name: gridsense_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gridsense_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
     image: postgres:15
     container_name: gridsense_postgres
     restart: unless-stopped
     ports:
       - "5432:5432"
     environment:
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: ${POSTGRES_DB}
     volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
     networks:
      - gridsense_net
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U gridsense -d gridsense"]
       interval: 10s
       timeout: 5s
       retries: 5

  cache:
    image: redis:7-alpine
    container_name: gridsense_redis
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gridsense_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
   cassandra_data:
   neo4j_data:
   mongo_data:
   pg_data:
   redis_data:

networks:
  gridsense_net:
    driver: bridge

services:
  config-init:
    build:
      context: .
      dockerfile: api/Dockerfile
    entrypoint: ["python", "/app/scripts/init_env.py"]
    volumes:
      - .:/workspace
      - runtime_config:/config
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile

    entrypoint: ["/bin/sh", "-ec", ". /config/runtime.sh; . /config/seed-connections.sh; exec python /app/scripts/seed.py"]
    volumes:
      - runtime_config:/config:ro
    networks:
      - gridsense_net
    depends_on:
      config-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: "no"

  api:
    entrypoint: ["/bin/sh", "-ec", ". /config/runtime.sh; . /config/connections.sh; exec uvicorn api.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - runtime_config:/config:ro
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    networks:
      - gridsense_net
    depends_on:
      seed:
        condition: service_completed_successfully
      timeseries-db:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      catalog-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  timeseries-db:
     image: cassandra:4.1
     container_name: gridsense_cassandra
     restart: unless-stopped
     ports:
       - "9042:9042"
     environment:
       CASSANDRA_CLUSTER_NAME: "GridSenseCluster"
       CASSANDRA_DC: "dc1"
       HEAP_NEWSIZE: "128M"
       MAX_HEAP_SIZE: "512M"
     volumes:
       - cassandra_data:/var/lib/cassandra
       - ./cql/init.cql:/docker-entrypoint-initdb.d/init.cql
     networks:
      - gridsense_net
     healthcheck:
       test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
       interval: 30s
       timeout: 10s
       retries: 10

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      config-init:
        condition: service_completed_successfully
      timeseries-db:
        condition: service_healthy
    volumes:
      - ./cql/init.cql:/init.cql:ro
      - runtime_config:/config:ro
    networks:
      - gridsense_net
    entrypoint: ["/bin/sh", "-ec"]
    command: ['. /config/connections.sh; exec cqlsh "$${CASSANDRA_HOST}" "$${CASSANDRA_PORT}" -f /init.cql']
    restart: "no"

  graph-db:
     entrypoint:
       - /bin/sh
       - -ec
       - |
         . /config/runtime.sh
         export NEO4J_AUTH="$${NEO4J_USER}/$${NEO4J_PASSWORD}"
         unset NEO4J_USER NEO4J_PASSWORD POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
         exec /startup/docker-entrypoint.sh neo4j
     depends_on:
       config-init:
         condition: service_completed_successfully
     image: neo4j:5-community
     container_name: gridsense_neo4j
     restart: unless-stopped
     ports:
       - "7474:7474"
       - "7687:7687"
     environment:
       NEO4J_PLUGINS: '["apoc"]'
       NEO4J_dbms_memory_heap_max__size: "512M"
     volumes:
       - runtime_config:/config:ro
       - neo4j_data:/data
       - ./neo4j/import:/import
     networks:
       - gridsense_net
     healthcheck:
       test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]

  catalog-db:
    image: mongo:7
    container_name: gridsense_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gridsense_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
     entrypoint: ["/bin/sh", "-ec", ". /config/runtime.sh; exec docker-entrypoint.sh postgres"]
     depends_on:
       config-init:
         condition: service_completed_successfully
     image: postgres:15
     container_name: gridsense_postgres
     restart: unless-stopped
     ports:
       - "5432:5432"
     volumes:
      - runtime_config:/config:ro
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
     networks:
      - gridsense_net
     healthcheck:
       test: ["CMD-SHELL", '. /config/runtime.sh; pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
       interval: 10s
       timeout: 5s
       retries: 5

  cache:
    image: redis:7-alpine
    container_name: gridsense_redis
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gridsense_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
   runtime_config:
   cassandra_data:
   neo4j_data:
   mongo_data:
   pg_data:
   redis_data:

networks:
  gridsense_net:
    driver: bridge
